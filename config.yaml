behaviors:
  EnemyAgent:
    trainer_type: ppo

    hyperparameters:
      batch_size: 32
      buffer_size: 512
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: false
      hidden_units: 64
      num_layers: 1

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 300000
    time_horizon: 32
    summary_freq: 10000


engine_settings:
  time_scale: 20
  target_frame_rate: -1
  no_graphics: true